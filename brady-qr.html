<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adman • Brady QR Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#0b2339;--navy-2:#123048;--red:#bd1d23;--ink:#1a2530;--muted:#5f6b75;
  --line:#d9e0e5;--bg:#eef1f4;--card:#ffffff;
  --disp:"Barlow Semi Condensed",Arial,sans-serif;
  --ui:"Inter",Arial,Helvetica,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;}
header{position:relative;background:var(--navy);color:#fff;padding:22px 20px;text-align:center;border-bottom:3px solid var(--red);}
.logo{position:absolute;top:14px;left:16px;height:46px;width:auto;background:#fff;padding:5px 9px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18);}
header h1{margin:0;font-family:var(--disp);letter-spacing:.5px;font-size:26px;text-transform:uppercase;}
header p{margin:6px 0 0;color:#9fb2c4;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
.container{max-width:760px;margin:26px auto;padding:0 18px 60px;}
.card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 4px 22px rgba(11,35,57,.10);}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--red);margin:0 0 6px;}
.drop-zone{border:2px dashed #aab4bd;border-radius:12px;padding:34px 20px;text-align:center;cursor:pointer;color:var(--muted);transition:.15s;}
.drop-zone:hover{border-color:var(--navy);background:#f4f8fb;}
.drop-zone.dragover{border-color:var(--red);background:#fdf3f3;}
.drop-zone strong{display:block;font-family:var(--disp);font-size:20px;text-transform:uppercase;color:var(--navy);margin-bottom:6px;letter-spacing:.5px;}
.drop-zone span{font-size:13px;}
#fileInput{display:none;}
#fileName{margin-top:10px;font-size:12px;color:var(--muted);text-align:center;font-family:var(--mono);}
.qr-link-row{text-align:center;margin-top:14px;}
.qr-link{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);font-size:13px;font-weight:600;text-decoration:none;transition:.12s;}
.qr-link:hover{border-color:var(--red);color:var(--red);background:#fdf3f3;}
.qr-link svg{width:14px;height:14px;}
.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;margin-top:16px;font-size:13px;color:var(--muted);}
.controls label{display:flex;align-items:center;gap:8px;}
.controls input[type=checkbox]{width:16px;height:16px;accent-color:var(--red);}
.controls input[type=number]{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:13px;}
.dim{font-family:var(--mono);color:var(--navy);}
.preview-section{margin-top:22px;text-align:center;}
.preview-title{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.preview-background{background:repeating-linear-gradient(45deg,#e2e5e8,#e2e5e8 10px,#dce0e3 10px,#dce0e3 20px);border-radius:12px;min-height:300px;display:flex;justify-content:center;align-items:center;padding:26px;}
#preview{background:#fff;display:flex;justify-content:center;align-items:center;box-shadow:0 6px 22px rgba(11,35,57,.30);position:relative;}
#qrImage{width:100%;height:100%;object-fit:contain;display:none;}
.placeholder{color:#a7afb6;font-size:12px;font-family:var(--mono);letter-spacing:1px;line-height:1.7;text-transform:uppercase;}
.size-label{margin-top:12px;font-size:12px;color:var(--muted);font-family:var(--mono);}
.size-label b{color:var(--navy);}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:22px;}
button{border:none;border-radius:9px;padding:14px 10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ui);letter-spacing:.3px;transition:.12s;}
button:disabled{opacity:.4;cursor:not-allowed;}
.pdf-button{background:var(--red);color:#fff;}
.pdf-button:hover:not(:disabled){background:#a3161b;}
.print-button{background:var(--navy);color:#fff;}
.print-button:hover:not(:disabled){background:var(--navy-2);}
.save-button{background:#e6ebef;color:var(--navy);}
.save-button:hover:not(:disabled){background:#d9e0e5;}
.status{margin-top:16px;background:#f0f3f5;border-left:3px solid var(--navy);border-radius:6px;padding:11px 13px;font-size:13px;color:#4b5661;}
@media (max-width:520px){
  header{padding-top:74px;}
  .logo{left:50%;transform:translateX(-50%);height:42px;}
}
#printLayer{display:none;}
@media print{ .app{display:none !important;} #printLayer{display:flex;align-items:center;justify-content:center;background:#fff;} #printImg{object-fit:contain;display:block;} }
</style>
<style id="printStyle"></style>
</head>

    <h1>Brady QR Maker</h1>
  </header>

  <div class="container">
    <div class="card">

      <p class="eyebrow">01 — Load QR</p>
      <div class="drop-zone" id="dropZone">
        <strong>Drop QR code here</strong>
        <span>or tap to choose a PNG</span>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/svg+xml">
      </div>
      <div id="fileName">No QR code selected</div>

      <div class="qr-link-row">
        <a class="qr-link" href="https://www.qrcode-monkey.com/" target="_blank" rel="noopener noreferrer">
          Need a QR code? Make one at QR Monkey
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>
        </a>
      </div>

      <div class="controls">
        <label>Tape width <span class="dim">2.25&Prime;</span> (fixed)</label>
        <label>Label length
          <input type="number" id="lenInput" value="2.25" min="1" max="4" step="0.05"> <span class="dim">in</span>
        </label>
        <label><input type="checkbox" id="quietZone" checked> White border</label>
      </div>

      <p class="eyebrow" style="margin-top:22px;">02 — Preview</p>
      <div class="preview-section">
        <div class="preview-title">Actual label — what prints</div>
        <div class="preview-background">
          <div id="preview">
            <div class="placeholder" id="placeholder">QR<br>Preview</div>
            <img id="qrImage" alt="QR preview">
          </div>
        </div>
        <div class="size-label" id="sizeLabel">Label: <b>2.25&Prime; × 2.25&Prime;</b> &bull; QR fills to a square</div>
      </div>

      <p class="eyebrow" style="margin-top:22px;">03 — Output</p>
      <div class="buttons">
        <button class="pdf-button" id="pdfButton" disabled>Print PDF (best)</button>
        <button class="print-button" id="printButton" disabled>Browser print</button>
        <button class="save-button" id="saveButton" disabled>Save PNG</button>
      </div>

      <div class="status" id="status">Select a QR code to begin.</div>

    </div>
  </div>

    preview.style.width=(TAPE_IN*96)+'px';
    preview.style.height=(labelLen()*96)+'px';
    sizeLabel.innerHTML='Label: <b>'+frac(TAPE_IN)+' × '+frac(labelLen())+'</b> &bull; QR = largest centered square';
  }
  function setPrintStyle(){
    var L=labelLen();
    printStyle.textContent=
      '@media print{'+
      '@page{size:'+TAPE_IN+'in '+L+'in;margin:0;}'+
      'html,body{width:'+TAPE_IN+'in;height:'+L+'in;margin:0;padding:0;background:#fff;overflow:hidden;}'+
      '#printLayer{display:flex !important;position:fixed;inset:0;width:'+TAPE_IN+'in;height:'+L+'in;margin:0;padding:0;align-items:center;justify-content:center;background:#fff;page-break-after:avoid;page-break-inside:avoid;}'+
      '#printImg{width:'+TAPE_IN+'in;height:'+L+'in;object-fit:contain;display:block;}'+
      '}';
  }

  dropZone.addEventListener('click',function(){ fileInput.click(); });
  fileInput.addEventListener('change',function(e){ if(e.target.files&&e.target.files[0]) handleFile(e.target.files[0]); });
  ['dragenter','dragover'].forEach(function(ev){ dropZone.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();dropZone.classList.add('dragover');}); });
  ['dragleave','drop'].forEach(function(ev){ dropZone.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();dropZone.classList.remove('dragover');}); });
  dropZone.addEventListener('drop',function(e){ var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) handleFile(f); });

  function handleFile(file){
    if(!/^image\//.test(file.type)&&!/\.(png|jpe?g|webp|svg)$/i.test(file.name)){ setStatus('That file is not an image. Choose a QR PNG.'); return; }
    var reader=new FileReader();
    reader.onload=function(ev){ sourceDataUrl=ev.target.result; fileNameEl.textContent=file.name; renderComposite(); };
    reader.onerror=function(){ setStatus('Could not read that file. Try again.'); };
    reader.readAsDataURL(file);
  }

  lenInput.addEventListener('input',function(){ sizePreview(); setPrintStyle(); if(sourceDataUrl) renderComposite(); });
  quietChk.addEventListener('change',function(){ if(sourceDataUrl) renderComposite(); });

  function renderComposite(){
    if(!sourceDataUrl) return;
    var img=new Image();
    img.onload=function(){
      var Wp=Math.round(TAPE_IN*DPI), Hp=Math.round(labelLen()*DPI);
      var qrMax=Math.min(Wp,Hp);
      var canvas=document.createElement('canvas');
      canvas.width=Wp; canvas.height=Hp;
      var ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,Wp,Hp);
      var margin=quietChk.checked?Math.round(qrMax*0.06):0;
      var avail=qrMax-margin*2;
      var scale=Math.min(avail/img.width,avail/img.height);
      var w=img.width*scale, h=img.height*scale;
      var x=(Wp-w)/2, y=(Hp-h)/2;
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(img,x,y,w,h);
      lastCanvas=canvas; lastDataUrl=canvas.toDataURL('image/png');
      qrImage.src=lastDataUrl; qrImage.style.display='block';
      printImg.src=lastDataUrl;
      placeholder.style.display='none';
      pdfBtn.disabled=false; printBtn.disabled=false; saveBtn.disabled=false;
      setStatus('Ready. Preview matches the printed label exactly.');
    };
    img.onerror=function(){ setStatus('That image could not be decoded.'); };
    img.src=sourceDataUrl;
  }

  pdfBtn.addEventListener('click',function(){
    if(!lastDataUrl) return;
    if(!(window.jspdf&&window.jspdf.jsPDF)){ setStatus('PDF engine did not load (needs internet). Use Browser print instead.'); return; }
    var L=labelLen();
    var doc=new window.jspdf.jsPDF({unit:'in',format:[TAPE_IN,L],orientation:(TAPE_IN>=L?'landscape':'portrait')});
    doc.addImage(lastDataUrl,'PNG',0,0,TAPE_IN,L,undefined,'FAST');
    doc.autoPrint();
    window.open(doc.output('bloburl'),'_blank');
    setStatus('PDF opened. In the dialog set Scale = 100% / Actual size, Margins = None.');
  });

  printBtn.addEventListener('click',function(){ if(lastDataUrl){ setPrintStyle(); window.print(); } });

  saveBtn.addEventListener('click',function(){
    if(!lastCanvas) return;
    lastCanvas.toBlob(function(blob){
      if(!blob){ setStatus('Export failed.'); return; }
      blob.arrayBuffer().then(function(buf){
        var out=injectPhys(new Uint8Array(buf),DPI);
        downloadBytes(out,'QR_'+TAPE_IN+'x'+labelLen()+'_300dpi.png');
        setStatus('Saved PNG at 300 DPI.');
      });
    },'image/png');
  });

  function downloadBytes(bytes,name){
    var url=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));
    var a=document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },1500);
  }

  var crcTable=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
  function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=crcTable[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  function injectPhys(png,dpi){
    var ppm=Math.round(dpi/0.0254);
    var data=new Uint8Array(9),dv=new DataView(data.buffer);
    dv.setUint32(0,ppm);dv.setUint32(4,ppm);data[8]=1;
    var type=new Uint8Array([0x70,0x48,0x59,0x73]);
    var td=new Uint8Array(13);td.set(type,0);td.set(data,4);
    var crc=crc32(td);
    var chunk=new Uint8Array(21),cdv=new DataView(chunk.buffer);
    cdv.setUint32(0,9);chunk.set(type,4);chunk.set(data,8);cdv.setUint32(17,crc);
    var pos=33,out=new Uint8Array(png.length+chunk.length);
    out.set(png.subarray(0,pos),0);out.set(chunk,pos);out.set(png.subarray(pos),pos+chunk.length);
    return out;
  }

  sizePreview(); setPrintStyle();
})();
</script>
</body>
</html>
